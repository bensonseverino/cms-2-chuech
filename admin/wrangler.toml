# ---------------------------------------------------------------------------
# marino-cms — the admin Pages project (spec §9.1).
#
# Binding names are FIXED: DB, MEDIA, CACHE. The site project binds the same
# database, the same bucket and the same KV namespace, so these names must
# match `site-integration/wrangler.toml` exactly.
#
# Every `<...>` placeholder below is filled in from the values the owner
# supplies in docs/cloudflare-setup.md (Phase 1). Nothing here is a secret —
# secrets are set with `wrangler pages secret put` (see the same doc).
#
# CAUTION (spec §2 Phase 2 step 4): while a Pages project has bindings/vars in
# the dashboard, adding this file makes the file the source of truth. Copy any
# dashboard-only setting into this file before the first deploy.
# ---------------------------------------------------------------------------

name = "marino-cms"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# --- D1: structured content, form submissions, media index -------------------
[[d1_databases]]
binding = "DB"
database_name = "marino-cms"
database_id = "<prod id from `wrangler d1 create marino-cms`>"
preview_database_id = "<preview id from `wrangler d1 create marino-cms-preview`>"
# Migrations live once, at the repo root, and are shared with the site project.
migrations_dir = "../migrations"

# --- R2: the shared media bucket (existing objects untouched) ----------------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "marino-media"
# Preview uploads use the same bucket under the `uploads/` prefix, tagged
# source = 'upload' in the preview D1 only (spec §9.1). Point this at a
# separate bucket if you would rather keep previews fully isolated.
preview_bucket_name = "marino-media"

# --- KV: content_version (cache-busting) + form rate-limit counters ----------
[[kv_namespaces]]
binding = "CACHE"
id = "<prod id from `wrangler kv namespace create CACHE`>"
preview_id = "<preview id from `wrangler kv namespace create CACHE --preview-name ...`>"

# --- Plain variables (public; no secrets here) -------------------------------
[vars]
# TODO(owner): set after Phase 1 — see docs/cloudflare-setup.md §4 and §11.
MEDIA_PUBLIC_BASE = "https://media.example.com"
SITE_ORIGIN = "https://example.com"
CMS_ORIGIN = "https://cms.example.com"
CF_ACCESS_TEAM_DOMAIN = "<team>.cloudflareaccess.com"
BOOTSTRAP_ADMIN_EMAIL = "owner@example.com"

# --- Local development only (.dev.vars, never in Cloudflare) -----------------
# Create admin/.dev.vars with:
#   DEV_USER_EMAIL=you@example.com
# It is git-ignored and is the ONLY way the admin API bypasses Access.
